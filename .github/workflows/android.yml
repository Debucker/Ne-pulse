name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        working-directory: android
        env:
          NEPULSE_VERSION_CODE: ${{ github.run_number }}
          NEPULSE_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleRelease :app:assembleDebug 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> " android/build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Collect APKs
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/ne-pulse.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/ne-pulse-debug.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/

  # Runs the debug build on an emulator against the live network: it must
  # register, connect and receive a status from the server.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/ci/e2e.sh out/ne-pulse-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: NE-PULSE for Android 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: out/ne-pulse.apk
          body: |
            Install: open https://ne-pulse.com/app on an Android phone.
            Direct file: ne-pulse.apk below.
